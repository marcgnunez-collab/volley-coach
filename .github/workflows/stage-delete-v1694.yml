name: Stage V16.9.4 deletion UI
on:
  push:
    branches: ['fix/v1694-sync-safety-audit']
    paths: ['scripts/stage-delete-v1694.py']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stage-delete-v1694.py
      - run: node --check vc-sync-v1693.js && node --check vc-delete-entry-v1694.js && node tests/index-integrity.cjs && node tests/sync-regression.cjs
      - name: Commit candidate assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate scout deletion button in V16.9.4'
            git push
          fi
