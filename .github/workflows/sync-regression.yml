name: Sync guard regression
on:
  push:
    branches: ['main', 'fix/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check vc-sync-v1693.js && node --check vc-recovery-v169.js && node --check vc-csv-reconcile-v1691.js && node --check service-worker.js
      - name: Guard tests
        run: node tests/sync-regression.cjs && node tests/index-integrity.cjs
