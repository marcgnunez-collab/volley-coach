name: Build V16.9.5 management candidate
on:
  push:
    branches: ['fix/v1695-gestion-scoutings-sync']
    paths: ['scripts/build-v1695.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate
        run: python scripts/build-v1695.py
      - name: Check application scripts
        run: |
          node --check vc-sync-v1693.js
          node --check vc-scout-management-v1695.js
          node tests/index-integrity.cjs
          node tests/sync-regression.cjs
      - name: Save staged build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Stage V16.9.5 management and synchronization candidate'
            git push
          fi
