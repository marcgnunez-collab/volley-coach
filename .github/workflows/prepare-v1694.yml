name: Prepare V16.9.4 candidate index
on:
  push:
    branches: ['fix/v1694-sync-safety-audit']
    paths: ['scripts/prepare-v1694.py']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch staged HTML and service worker
        run: python scripts/prepare-v1694.py
      - name: Check candidate scripts
        run: node --check vc-reopen-safe-v1694.js && node --check vc-reopen-entry-v1694.js && node tests/index-integrity.cjs && node tests/sync-regression.cjs
      - name: Commit candidate only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'Stage V16.9.4 HTML and PWA assets in fix branch'
            git push
          fi
